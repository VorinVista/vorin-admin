name: Notify Boring

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Send repository dispatch to Boring
        if: ${{ vars.BORING_TARGET_REPO != '' && secrets.BORING_REPO_DISPATCH_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.BORING_REPO_DISPATCH_TOKEN }}
          TARGET_REPO: ${{ vars.BORING_TARGET_REPO }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          curl --fail --show-error --silent \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/$TARGET_REPO/dispatches \
            -d "{\"event_type\":\"vorin_repo_updated\",\"client_payload\":{\"source_repo\":\"$SOURCE_REPO\",\"source_sha\":\"$SOURCE_SHA\",\"source_ref\":\"$SOURCE_REF\"}}"

      - name: Missing configuration
        if: ${{ vars.BORING_TARGET_REPO == '' || secrets.BORING_REPO_DISPATCH_TOKEN == '' }}
        run: echo "Set BORING_TARGET_REPO and BORING_REPO_DISPATCH_TOKEN to enable dispatch."
